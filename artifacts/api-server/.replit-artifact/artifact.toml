kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "BPDPKS Scholarship API"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["composer", "install", "--working-dir=artifacts/api-server/laravel-app", "--no-dev", "--optimize-autoloader", "--no-interaction"]

[services.production.run]
args = ["bash", "artifacts/api-server/scripts/start-laravel-api.sh"]

[services.production.run.env]
PORT = "8080"
APP_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
